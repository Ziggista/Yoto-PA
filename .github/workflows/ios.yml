name: iOS build

# Manual only for now: macOS runner minutes count 10x on private repos.
# - unsigned:   no Apple account needed. Proves the iOS project compiles and uploads an unsigned
#               .ipa (re-signable with Sideloadly/AltStore using a free Apple ID; NFC will not work).
# - testflight: needs the Apple Developer Program and the four secrets in docs/ios.md.
#               Signs with automatic signing via an App Store Connect API key and uploads to TestFlight.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options: [unsigned, testflight]
        default: unsigned

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: ios/App/App.xcodeproj
  XCODE_SCHEME: App

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build web assets
        run: |
          npm ci
          npm run ios:sync

      - name: Build unsigned
        if: inputs.mode == 'unsigned'
        run: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/export/Payload/"
          (cd "$RUNNER_TEMP/export" && zip -qry "Yoto-PA-unsigned.ipa" Payload && rm -rf Payload)

      - name: Write App Store Connect API key
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::APP_STORE_CONNECT_KEY_P8 secret is not set (see docs/ios.md)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive and upload to TestFlight
        if: inputs.mode == 'testflight'
        run: |
          AUTH=(-allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8"
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}")
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

      - name: Keep the .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoto-pa-ios-${{ inputs.mode }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
